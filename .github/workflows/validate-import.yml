name: Validate timetable import
on:
  pull_request:
    paths:
      - 'data/rozklady/linie/**'
      - 'data/trips/**'
      - 'data/import-config/**'
      - 'data/stops/**'
      - 'tools/import-excel.py'
      - 'tools/check-line5.py'
      - 'tools/check-line6.py'
      - 'tools/check-line7.py'
      - 'tools/check-line8.py'
      - 'tools/check-line8-pages.py'
      - 'tools/check-line9.py'
      - 'tools/test-line9-import.py'
      - 'tools/check-line10.py'
      - 'tools/test-line10-import.py'
      - 'tools/check-line11.py'
      - 'tools/test-line11-import.py'
      - 'tools/check-line12.py'
      - 'tools/test-line12-import.py'
      - 'tools/check-line13.py'
      - 'tools/test-line13-import.py'
      - 'tools/check-line14.py'
      - 'tools/test-line14-import.py'
      - 'tools/check-line15.py'
      - 'tools/test-line15-import.py'
      - 'linie/15.html'
      - 'linie/14.html'
      - 'linie/13.html'
      - 'linie/12.html'
      - 'linie/11.html'
      - 'linie/10.html'
      - 'linie/9.html'
      - 'js/mapa.js'
      - 'mapa.html'
      - 'tools/check-terminal-arrivals.py'
      - 'tools/test-import-excel.py'
      - 'tools/test-variant-origins.py'
      - 'tools/test-repeated-stops.py'
      - 'tools/generate-rozklady.py'
      - 'linie/8.html'
      - '.github/workflows/validate-import.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Validate line 5 data
        run: python tools/check-line5.py
      - name: Test stop label parsing
        run: python tools/test-import-excel.py
      - name: Test variant IDs with different starting stops
        run: python tools/test-variant-origins.py
      - name: Test repeated stop IDs and terminal arrivals
        run: python tools/test-repeated-stops.py
      - name: Validate line 6 data
        run: python tools/check-line6.py
      - name: Validate line 7 circular route
        run: python tools/check-line7.py
      - name: Validate line 9 importer against course data
        run: python tools/test-line9-import.py
      - name: Validate line 10 importer against course data
        run: python tools/test-line10-import.py
      - name: Validate line 11 importer against course data
        run: python tools/test-line11-import.py
      - name: Validate line 12 importer against course data
        run: python tools/test-line12-import.py
      - name: Validate line 13 importer against course data
        run: python tools/test-line13-import.py
      - name: Validate line 14 importer against course data
        run: python tools/test-line14-import.py
      - name: Validate line 15 importer against course data
        run: python tools/test-line15-import.py
      - name: Validate line 8 circular route and terminal arrivals
        run: python tools/check-line8.py
      - name: Check terminal arrival filtering
        run: python tools/check-terminal-arrivals.py
      - name: Verify importer syntax
        run: python -m py_compile tools/import-excel.py
      - name: Generate HTML and stop departures (without committing)
        run: python tools/generate-rozklady.py > /tmp/kmmz-generated.log
      - name: Verify line 9 Excel source and generated timetable pages
        run: python tools/check-line9.py
      - name: Verify line 10 revised Excel source and generated pages
        run: python tools/check-line10.py
      - name: Verify line 11 corrected Excel source and generated pages
        run: python tools/check-line11.py
      - name: Verify line 12 Excel source, route and generated pages
        run: python tools/check-line12.py
      - name: Verify line 13 Excel source, variant and generated pages
        run: python tools/check-line13.py
      - name: Verify line 14 Excel source, G/S variants, and generated pages
        run: python tools/check-line14.py
      - name: Verify line 15 Excel source, route, and generated pages
        run: python tools/check-line15.py
      - name: Verify line 8 generated pages, map directions and stop visibility
        run: python tools/check-line8-pages.py
      - name: Confirm line 5 pages
        run: |
          test -f rozklady/5/0465-olkusz.html
          test -f rozklady/5/0466-slawkow.html
          test -f data/odjazdy/0465.json
          test -f przystanki/0465.html
          test -f rozklady/6/0633-wilczkowice.html
          test -f rozklady/6/0669-oswiecim.html
          test -f data/odjazdy/0633.json
          test -f przystanki/0669.html
          test -f rozklady/7/0684-okrezna.html
          test -f rozklady/15/2627-oswiecim.html
          test -f rozklady/15/0879-oswiecim.html
          test -f rozklady/15/0830-jawiszowice.html
          test -f rozklady/15/2627-jawiszowice.html
          test -f data/odjazdy/2627.json
          test -f data/odjazdy/0830.json
          test -f przystanki/0879.html
          test -f rozklady/14/1399-chrzanow.html
          test -f rozklady/14/1484-chrzanow.html
          test -f rozklady/14/0334-grojec.html
          test -f rozklady/14/1484-grojec.html
          test -f rozklady/14/1399-grojec.html
          test -f data/odjazdy/0334.json
          test -f data/odjazdy/1399.json
          test -f przystanki/1484.html
          test -f rozklady/13/2769-zwm.html
          test -f rozklady/13/0449-zwm.html
          test -f rozklady/13/0168-zwm.html
          test -f rozklady/13/0168-groniec.html
          test -f rozklady/13/0483-groniec.html
          test -f rozklady/13/2769-groniec.html
          test -f data/odjazdy/2769.json
          test -f przystanki/0168.html
          test -f rozklady/12/2568-metkow.html
          test -f rozklady/12/0311-metkow.html
          test -f rozklady/12/0311-jawiszowice.html
          test -f rozklady/12/2557-jawiszowice.html
          test -f data/odjazdy/2568.json
          test -f data/odjazdy/0311.json
          test -f przystanki/2557.html
          test -f rozklady/11/0200-tarnawa.html
          test -f rozklady/11/0747-tarnawa.html
          test -f rozklady/11/0747-olkusz.html
          test -f rozklady/11/0200-olkusz.html
          test -f data/odjazdy/0752.json
          test -f przystanki/0752.html
          test -f rozklady/10/0147-okrezna-1-koniec.html
          test -f rozklady/10/0147-okrezna-2-koniec.html
          test -f rozklady/10/0106-okrezna-2.html
          test -f data/odjazdy/0147.json
          test -f przystanki/0147.html
          test -f rozklady/9/0001-okrezna-1-koniec.html
          test -f rozklady/9/0001-okrezna-2-ponownie.html
          test -f rozklady/9/0015-okrezna-2.html
          test -f data/odjazdy/0001.json
          test -f przystanki/0001.html
          test -f rozklady/8/0200-okrezna.html
          test -f rozklady/8/0200-okrezna-koniec.html
          test -f rozklady/8/0199-okrezna.html
          test -f data/odjazdy/0200.json
          test -f przystanki/0200.html
          test -f rozklady/7/0334-okrezna.html
          grep -Fq '<div class="route-title">Kierunek: Chrzanów Fablok</div>' rozklady/7/0681-okrezna.html
          grep -Fq '<div class="route-title">Kierunek: Chrzanów Dworzec Autobusowy</div>' rozklady/7/0682-okrezna.html
          test -f data/odjazdy/0684.json
          test -f przystanki/0684.html
          echo "Lines 5, 6 and 7 output exists"
