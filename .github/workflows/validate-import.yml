name: Validate timetable import
on:
  pull_request:
    paths:
      - 'data/rozklady/linie/**'
      - 'data/trips/**'
      - 'data/import-config/**'
      - 'data/stops/**'
      - 'tools/import-excel.py'
      - 'tools/check-line5.py'
      - 'tools/check-line6.py'
      - 'tools/check-line7.py'
      - 'tools/check-terminal-arrivals.py'
      - 'tools/test-import-excel.py'
      - 'tools/generate-rozklady.py'
      - '.github/workflows/validate-import.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Validate line 5 data
        run: python tools/check-line5.py
      - name: Test stop label parsing
        run: python tools/test-import-excel.py
      - name: Validate line 6 data
        run: python tools/check-line6.py
      - name: Validate line 7 circular route
        run: python tools/check-line7.py
      - name: Check terminal arrival filtering
        run: python tools/check-terminal-arrivals.py
      - name: Verify importer syntax
        run: python -m py_compile tools/import-excel.py
      - name: Generate HTML and stop departures (without committing)
        run: python tools/generate-rozklady.py > /tmp/kmmz-generated.log
      - name: Confirm line 5 pages
        run: |
          test -f rozklady/5/0465-olkusz.html
          test -f rozklady/5/0466-slawkow.html
          test -f data/odjazdy/0465.json
          test -f przystanki/0465.html
          test -f rozklady/6/0633-wilczkowice.html
          test -f rozklady/6/0669-oswiecim.html
          test -f data/odjazdy/0633.json
          test -f przystanki/0669.html
          test -f rozklady/7/0684-okrezna.html
          test -f rozklady/7/0334-okrezna.html
          grep -Fq '<div class="route-title">Kierunek: Chrzanów Fablok</div>' rozklady/7/0681-okrezna.html
          grep -Fq '<div class="route-title">Kierunek: Chrzanów Dworzec Autobusowy</div>' rozklady/7/0682-okrezna.html
          test -f data/odjazdy/0684.json
          test -f przystanki/0684.html
          echo "Lines 5, 6 and 7 output exists"
