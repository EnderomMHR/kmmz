name: Generate rozklady

on:
  workflow_dispatch:

  push:
    paths:
      - 'data/rozklady/linie/**'
      - 'tools/generate-rozklady.py'
      - '.github/workflows/generate-rozklady.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4

      - name: Ustaw Pythona
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Uruchom generator
        run: python tools/generate-rozklady.py

      - name: Zapisz wygenerowane pliki
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add rozklady data/odjazdy
          git diff --cached --quiet || git commit -m "Generate rozklady"
          git push
