<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Mapa KMMZ</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Leaflet CSS -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet/dist/leaflet.css"
  />

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #102a43;
      overflow: hidden;
    }

    header {
      height: 55px;
      padding: 14px 18px;
      background: #f5c400;
      color: #102a43;
      font-weight: bold;
      font-size: 22px;
      box-shadow: 0 3px 12px rgba(0,0,0,.25);
      position: relative;
      z-index: 1001;
    }

    #map {
      height: calc(100vh - 55px);
      width: 100%;
    }

    .stop-panel {
      position: absolute;
      top: 75px;
      right: 20px;
      width: 390px;
      max-width: calc(100vw - 40px);
      max-height: calc(100vh - 95px);
      background: #ffffff;
      border-radius: 22px;
      box-shadow: 0 18px 45px rgba(0,0,0,.35);
      z-index: 1000;
      overflow: hidden;
      border: 2px solid var(--zone-border, #d9e6f2);
      display: flex;
      flex-direction: column;
      transform: translateX(430px);
      opacity: 0;
      pointer-events: none;
      transition: .25s ease;
    }

    .stop-panel.open {
      transform: translateX(0);
      opacity: 1;
      pointer-events: auto;
    }

    .stop-panel-header {
      background:
        linear-gradient(135deg, var(--zone-main, #005bbb), var(--zone-dark, #003f7d)),
        repeating-linear-gradient(45deg, rgba(255,255,255,.12) 0 6px, transparent 6px 14px);
      color: white;
      padding: 16px;
      position: relative;
      overflow: hidden;
    }

    .stop-panel-header::after {
      content: "";
      position: absolute;
      right: -35px;
      top: -35px;
      width: 120px;
      height: 120px;
      border: 18px solid rgba(255,255,255,.12);
      border-radius: 50%;
    }

    .panel-top-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: flex-start;
      position: relative;
      z-index: 2;
    }

    .panel-stop-id {
      display: inline-block;
      background: rgba(255,255,255,.22);
      border: 1px solid rgba(255,255,255,.45);
      padding: 5px 9px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .panel-stop-name {
      font-size: 22px;
      line-height: 1.15;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .panel-zone-badge {
      display: inline-block;
      background: rgba(255,255,255,.88);
      color: var(--zone-dark, #003f7d);
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: bold;
    }

    .panel-close {
      width: 34px;
      height: 34px;
      border: none;
      border-radius: 50%;
      background: rgba(255,255,255,.22);
      color: white;
      font-size: 24px;
      font-weight: bold;
      cursor: pointer;
      line-height: 1;
      position: relative;
      z-index: 3;
    }

    .panel-close:hover {
      background: rgba(255,255,255,.35);
    }

    .stop-panel-body {
      padding: 14px;
      overflow-y: auto;
      background:
        linear-gradient(180deg, var(--zone-light, #f4f8ff), #ffffff 180px);
    }

    .panel-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 12px;
    }

    .panel-tab {
      border: 1px solid var(--zone-border, #d9e6f2);
      background: white;
      color: #102a43;
      padding: 10px 8px;
      border-radius: 12px;
      font-weight: bold;
      cursor: pointer;
      transition: .15s;
    }

    .panel-tab.active {
      background: var(--zone-main, #005bbb);
      color: white;
      border-color: var(--zone-dark, #003f7d);
      box-shadow: 0 4px 12px rgba(0,0,0,.18);
    }

    .panel-section {
      display: none;
    }

    .panel-section.active {
      display: block;
    }

    .panel-subtitle {
      font-size: 14px;
      font-weight: bold;
      color: #102a43;
      margin: 12px 0 8px;
      padding-left: 4px;
      border-left: 5px solid var(--zone-main, #005bbb);
    }

    .departure-card {
      display: grid;
      grid-template-columns: 48px 1fr auto;
      gap: 9px;
      align-items: center;
      background: white;
      border: 1px solid #e1e8f0;
      border-left: 5px solid var(--zone-main, #005bbb);
      border-radius: 14px;
      padding: 9px 10px;
      margin: 7px 0;
      box-shadow: 0 3px 9px rgba(16,42,67,.08);
    }

    .departure-line {
      background: #f5c400;
      color: #222;
      font-weight: bold;
      text-align: center;
      border-radius: 9px;
      padding: 7px 4px;
      font-size: 17px;
    }

    .departure-direction {
      font-size: 13px;
      line-height: 1.25;
      color: #102a43;
      font-weight: bold;
    }

    .departure-time {
      font-size: 12px;
      color: #50647a;
      margin-top: 3px;
      font-weight: normal;
    }

    .departure-countdown {
      background: #eaf4ff;
      color: #005bbb;
      font-weight: bold;
      border-radius: 999px;
      padding: 6px 9px;
      white-space: nowrap;
      font-size: 12px;
      border: 1px solid #cfe4ff;
    }

    .departure-countdown.now {
      background: #f5c400;
      color: #222;
      border-color: #d6aa00;
      box-shadow: 0 0 0 3px rgba(245,196,0,.22);
    }

    .line-card {
      display: block;
      width: 100%;
      border: 1px solid #e1e8f0;
      background: white;
      border-left: 5px solid var(--zone-main, #005bbb);
      border-radius: 14px;
      padding: 9px 10px;
      margin: 7px 0;
      cursor: pointer;
      text-align: left;
      box-shadow: 0 3px 9px rgba(16,42,67,.08);
      transition: .15s;
    }

    .line-card:hover {
      transform: translateX(3px);
      background: var(--zone-light, #f4f8ff);
    }

    .line-card-row {
      display: grid;
      grid-template-columns: 48px 1fr;
      gap: 9px;
      align-items: center;
    }

    .line-number {
      background: #f5c400;
      color: #222;
      font-weight: bold;
      text-align: center;
      border-radius: 9px;
      padding: 7px 4px;
      font-size: 17px;
    }

    .line-direction {
      font-size: 13px;
      line-height: 1.25;
      color: #102a43;
      font-weight: bold;
    }

    .inline-timetable {
      margin-top: 12px;
      background: rgba(255,255,255,.88);
      border: 1px solid var(--zone-border, #d9e6f2);
      border-radius: 16px;
      padding: 12px;
    }

    .inline-timetable-title {
      font-weight: bold;
      color: #102a43;
      margin-bottom: 4px;
    }

    .inline-timetable-day {
      color: #50647a;
      font-size: 13px;
      margin-bottom: 10px;
    }

    .inline-time-list {
      display: grid;
      grid-template-columns: 1fr;
      gap: 6px;
    }

    .inline-time-row {
      display: grid;
      grid-template-columns: 70px 1fr;
      gap: 8px;
      align-items: center;
      background: white;
      border-radius: 10px;
      padding: 7px 9px;
      border: 1px solid #e6edf5;
    }

    .inline-time {
      font-weight: bold;
      color: var(--zone-dark, #003f7d);
      font-size: 15px;
    }

    .inline-time-direction {
      font-size: 12px;
      color: #50647a;
      line-height: 1.25;
    }

    .panel-empty {
      background: white;
      border: 1px dashed #b8c4d2;
      border-radius: 14px;
      padding: 16px;
      color: #607080;
      font-style: italic;
      text-align: center;
      margin-top: 8px;
    }

    .panel-link {
      display: inline-block;
      margin-top: 12px;
      text-decoration: none;
      background: var(--zone-main, #005bbb);
      color: white;
      border-radius: 999px;
      padding: 9px 12px;
      font-size: 13px;
      font-weight: bold;
    }

    .panel-link:hover {
      background: var(--zone-dark, #003f7d);
    }

    @media (max-width: 700px) {
      .stop-panel {
        top: auto;
        right: 10px;
        left: 10px;
        bottom: 10px;
        width: auto;
        max-width: none;
        max-height: 75vh;
        transform: translateY(110%);
      }

      .stop-panel.open {
        transform: translateY(0);
      }
    }
  </style>
</head>

<body>
  <header>Mapa KMMZ</header>

  <div id="map"></div>

  <aside id="stop-panel" class="stop-panel" aria-live="polite">
    <div class="stop-panel-header">
      <div class="panel-top-row">
        <div>
          <div id="panel-stop-id" class="panel-stop-id">ID</div>
          <div id="panel-stop-name" class="panel-stop-name">Wybierz przystanek</div>
          <div id="panel-zone" class="panel-zone-badge">STREFA</div>
        </div>
        <button id="panel-close" class="panel-close" type="button">×</button>
      </div>
    </div>

    <div class="stop-panel-body">
      <div class="panel-tabs">
        <button id="tab-nearest" class="panel-tab active" type="button">Najbliższe</button>
        <button id="tab-lines" class="panel-tab" type="button">Linie</button>
      </div>

      <section id="section-nearest" class="panel-section active">
        <div class="panel-subtitle">Najbliższe odjazdy — 4 godziny</div>
        <div id="nearest-departures"></div>
      </section>

      <section id="section-lines" class="panel-section">
        <div class="panel-subtitle">Linie z tego przystanku</div>
        <div id="served-lines"></div>
        <div id="line-timetable"></div>
      </section>

      <a id="panel-stop-page" class="panel-link" href="#" target="_self">Otwórz stronę przystanku</a>
    </div>
  </aside>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

  <!-- Nasz skrypt mapy -->
  <script src="js/mapa.js"></script>
</body>
</html>
